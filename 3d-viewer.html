<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Görüntüleyici</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>
</head>

<body>
    <model-viewer id="model-viewer" loading="lazy"
 alt="3D Model" camera-controls ar></model-viewer>

    <script>
        // URL'deki "model" sorgu parametresini al
        const urlParams = new URLSearchParams(window.location.search);
        const modelPath = urlParams.get('model');

        // Eğer model yolu varsa, model-viewer'ın src özelliğine ata
        if (modelPath) {
            const modelViewer = document.getElementById('model-viewer');
            modelViewer.setAttribute('src', modelPath);
        } else {
            console.error('URL\'de model yolu belirtilmemiş!');
        }
    </script>
</body>

</html>
